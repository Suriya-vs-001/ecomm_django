{% extends 'base.html' %}
{% block title %}Error - FashionStore{% endblock %}
{% block content %}
<section class="section">
    <div class="container mt-5" data-aos="fade-up">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-danger mb-3">
                    <div class="card-header bg-danger text-white">
                        <h3><i class="bi bi-exclamation-triangle-fill"></i> Access Denied</h3>
                    </div>
                    <div class="card-body text-center">
                        <h4 class="card-title text-danger">403 Forbidden</h4>
                        <p class="card-text lead">{{ error|default:"You do not have permission to access this page." }}
                        </p>
                        <a href="{% url 'index' %}" class="btn btn-outline-danger mt-3">Return to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
